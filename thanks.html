<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="refresh" content="3;url=https://pappukush.netlify.app/">
    <style>
        body {
            background: linear-gradient(135deg, #0f0f1a, #1a1a2f);
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .message {
            padding: 2rem;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            animation: fadeIn 1s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="message">
        <h1>Thank You! 🎉</h1>
        <p>Your message has been sent successfully.</p>
        <p>I will respond within 24 hours.</p>
        <p>Redirecting you back...</p>
    </div>
</body>
</html>
